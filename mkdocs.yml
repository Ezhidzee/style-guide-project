site_name: Стайлгайд документации
site_description: Руководство по стилю документации сервиса бронирования ресторанов
repo_url: https://github.com/Ezhidzee/style-guide-project
repo_name: Ezhidzee/style-guide-project
edit_uri: edit/main/docs/
theme:
  name: material
  language: ru
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Включить тёмную тему
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Включить светлую тему
  icon:
    repo: fontawesome/brands/github
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
extra_css:
  - stylesheets/extra.css
nav:
  - Главная: index.md
  - Принципы: general.md
  - Язык: language.md
  - Структура: structure.md
  - Оформление: formatting.md
  - API и данные: technical.md
  - Глоссарий: terminology.md
  - Доступность: accessibility.md
  - Практика:
      - Локальный запуск: examples/local-development.md
      - Создание бронирования через API: examples/create-booking.md

